<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Honey Broilers: counter layout options</title>
<style>
  :root { --accent:#d71920; --accent-soft:#fdebea; --bg:#fffaf2; --surface:#fff; --text:#1f1512; --muted:#6b5a52; --border:#eadccb; --green:#17803d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Noto Sans Tamil", Roboto, system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  button { font-family: inherit; cursor: pointer; }
  /* option switch */
  .switch { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #1f1512; color: #fff; font-size: 13px; }
  .switch b { margin-right: 4px; }
  .switch button { border: 0; border-radius: 999px; padding: 7px 16px; font-weight: 800; background: #3a2b25; color: #fff; font-size: 14px; }
  .switch button.on { background: #f59e0b; color: #1f1512; }
  .switch span { opacity: .7; margin-left: auto; }
  .app { flex: 1; min-height: 0; display: flex; }
  .rail { width: 84px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; }
  .logo { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; }
  .pill { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #e3f5e8; color: var(--green); }
  .gear { margin-top: auto; width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent); background: #fff; color: var(--accent); font-size: 20px; }
  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 12px 14px 14px; gap: 10px; }
  .tabs { flex: none; display: flex; border-bottom: 2px solid var(--border); }
  .tab { flex: 1; padding: 10px 0; border: 0; background: none; font-size: 18px; font-weight: 800; color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  /* colours by family */
  .c-cc { --c:#b45309; } .c-br { --c:#d71920; } .c-mu { --c:#8b1d3a; } .c-ot { --c:#2f6f5e; }
  .tag { background: rgba(255,255,255,.24); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .ptn { border: 2px solid var(--c, var(--accent)); background: #fff; color: var(--c, var(--accent)); border-radius: 14px; font-weight: 800; font-size: clamp(16px, 1.9vw, 26px); line-height: 1.05; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 0; white-space: nowrap; }
  .ptn small { font-size: clamp(11px, 1.1vw, 14px); font-weight: 700; color: var(--muted); }
  .ptn:active { background: var(--c, var(--accent)); color: #fff; } .ptn:active small { color: #fff; }
  .ptn.other { border-style: dashed; color: var(--text); border-color: #b9a896; }
  .row5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .lab { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }

  /* ===== A: pick the item, then use the bar ===== */
  .a-cards { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  .a-cards.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .a-card { background: var(--c); color: #fff; border: 4px solid transparent; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; text-align: center; }
  .a-card .n { font-size: clamp(22px, 2.6vw, 34px); font-weight: 800; line-height: 1.15; }
  .a-card .fam { font-size: 14px; font-weight: 700; opacity: .9; }
  .a-card .r { font-size: clamp(16px, 1.8vw, 22px); font-weight: 800; }
  .a-card.sel { border-color: #1f1512; box-shadow: 0 0 0 4px #f59e0b; }
  .a-card.dim { opacity: .55; }
  .a-bar { flex: none; background: var(--surface); border: 2px solid var(--border); border-radius: 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .a-bar .row5 { height: 74px; }
  .a-bar .hint { text-align: center; color: var(--muted); font-weight: 700; padding: 22px 0; }
  .a-bar .who { font-weight: 800; }

  /* ===== B: list on the left, big panel on the right ===== */
  .b { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .b-list { width: 36%; flex: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .b-item { flex: 1; min-height: 64px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; padding: 8px 16px; border: 2px solid var(--c); border-left-width: 10px; background: #fff; color: var(--text); border-radius: 14px; text-align: left; }
  .b-item .n { font-size: clamp(18px, 2vw, 26px); font-weight: 800; }
  .b-item .s { font-size: 13px; color: var(--muted); font-weight: 700; }
  .b-item.sel { background: var(--c); color: #fff; } .b-item.sel .s { color: #ffe9d6; }
  .b-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 2px solid var(--border); border-radius: 20px; padding: 12px; }
  .b-head { flex: none; background: var(--c); color: #fff; border-radius: 14px; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .b-head .n { font-size: clamp(20px, 2.4vw, 32px); font-weight: 800; }
  .b-sec { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .b-sec .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 8px; }

  /* ===== C: simple cards, two quick buttons ===== */
  .c-grid { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  .c-card { background: var(--surface); border: 2px solid var(--c); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .c-head { background: var(--c); color: #fff; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .c-head .n { font-size: clamp(18px, 2vw, 26px); font-weight: 800; }
  .c-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 0.8fr; gap: 8px; padding: 8px; }

  /* bill */
  .bill { width: 340px; flex: none; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px 14px 14px; gap: 8px; }
  .bill h2 { margin: 0; color: var(--accent); font-size: 17px; }
  .lines { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  .line { border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto 26px; gap: 1px 8px; align-items: center; }
  .line__name { font-weight: 800; } .line__amt { font-weight: 800; }
  .line__detail { grid-column: 1 / 3; font-size: 12px; color: var(--muted); }
  .x { grid-row: 1 / 3; grid-column: 3; border: 0; background: none; font-size: 18px; color: var(--muted); }
  .total { display: flex; justify-content: space-between; align-items: baseline; } .total span { color: var(--muted); } .total strong { font-size: 28px; }
  .sub { color: var(--muted); font-size: 12px; text-align: right; margin-top: -6px; }
  .print { height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 800; } .print:disabled { background: #e8dccb; color: var(--muted); }
  .pay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .pay button { height: 44px; border-radius: 12px; border: 2px solid var(--border); background: #fff; font-weight: 800; } .pay button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .note { font-size: 12px; color: #a80f15; background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }
  /* entry sheet */
  .back { position: fixed; inset: 0; background: rgba(20,21,26,.45); display: none; place-items: center; z-index: 9; } .back.on { display: grid; }
  .sheet { width: 440px; max-width: 94vw; background: #fff; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .sheet h4 { margin: 0; font-size: 20px; } .sheet .big { font-size: 38px; font-weight: 800; text-align: center; border: 2px solid var(--border); border-radius: 14px; padding: 6px; min-height: 62px; }
  .preview { text-align: center; color: var(--muted); font-weight: 700; min-height: 22px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .keys button { height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-size: 22px; font-weight: 800; }
  .rowb { display: flex; gap: 10px; } .rowb button { flex: 1; height: 50px; border-radius: 14px; border: 1px solid var(--border); background: #fff; font-weight: 800; font-size: 16px; } .rowb .go { background: var(--accent); color: #fff; border-color: var(--accent); }
  .more-sheet .sec { display: flex; flex-direction: column; gap: 4px; } .more-sheet .row5 { height: 66px; }
</style>
</head>
<body>
<div class="switch">
  <b>Layout:</b>
  <button data-l="A" class="on">A · Pick item, then weight bar</button>
  <button data-l="B">B · List left, weights right</button>
  <button data-l="C">C · Simple cards, 2 quick buttons</button>
  <span>Design sample: nothing is saved or printed. Rates are examples.</span>
</div>
<div class="app">
  <aside class="rail"><div class="logo">HB</div><span class="pill">● Online</span><span class="pill">✓ Printer</span><button class="gear">⚙</button></aside>
  <section class="main"><div class="tabs" id="tabs"></div><div class="stage" id="stage"></div></section>
  <aside class="bill">
    <h2>Bill</h2><div class="lines" id="lines"></div><div id="notice"></div>
    <div class="total"><span>Total</span><strong id="total">₹0.00</strong></div><div class="sub" id="sub"></div>
    <button class="print" id="print" disabled>Print bill ₹0.00</button><div class="pay" id="pay"></div>
  </aside>
</div>

<div class="back" id="back"><div class="sheet" id="sheet"></div></div>

<script>
// ---- Example catalogue (rates in paise per kg, or per piece) ---------------------------------------------------
const FAM = { cc: "Country chicken", br: "Broiler chicken", mu: "Mutton", ot: "Others" };
const CATALOG = {
  Chicken: [
    { id: "cc-bone", f: "cc", ta: "நாட்டுக்கோழி", en: "With bone", rate: 45000, unit: "kg" },
    { id: "cc-boneless", f: "cc", ta: "நாட்டுக்கோழி", en: "Boneless", rate: 65000, unit: "kg" },
    { id: "br-bone", f: "br", ta: "பிராய்லர்", en: "With bone", rate: 24000, unit: "kg" },
    { id: "br-boneless", f: "br", ta: "பிராய்லர்", en: "Boneless", rate: 32000, unit: "kg" } ],
  Mutton: [
    { id: "mu-bone", f: "mu", ta: "மட்டன்", en: "With bone", rate: 80000, unit: "kg" },
    { id: "mu-boneless", f: "mu", ta: "மட்டன்", en: "Boneless", rate: 95000, unit: "kg" },
    { id: "mu-kudal", f: "mu", ta: "குடல் (போட்டி)", en: "Intestines", rate: 20000, unit: "kg" },
    { id: "mu-liver", f: "mu", ta: "ஈரல்", en: "Liver", rate: 90000, unit: "kg" } ],
  Others: [
    { id: "ot-quail", f: "ot", ta: "காடை", en: "Quail", rate: 6000, unit: "piece" },
    { id: "ot-blood", f: "ot", ta: "இரத்தம்", en: "Blood", rate: 2000, unit: "piece" },
    { id: "ot-masala", f: "ot", ta: "மசாலா", en: "Masala", rate: 1000, unit: "piece" } ],
};
const WEIGHTS = [250, 500, 750, 1000], AMOUNTS = [100, 150, 200, 300], COUNTS = [1, 2, 3, 4], MAX_LINES = 5;
const all = () => Object.values(CATALOG).flat();

// ---- Maths (paise and grams) -----------------------------------------------------------------------------------
const money = (p) => "₹" + (p / 100).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const lineTotal = (rate, g) => Math.round(rate * g / 1000);
const gramsFor = (amtP, rate) => Math.round(amtP * 1000 / rate);
const kg = (g) => g < 1000 ? g + " g" : (g / 1000).toFixed(3).replace(/\.?0+$/, "") + " kg";
const $ = (id) => document.getElementById(id);

// ---- State -----------------------------------------------------------------------------------------------------
let layout = "A", tab = "Chicken", lines = [], payment = "Cash", sel = null, custom = null, entry = "";
const item = (id) => all().find((i) => i.id === id);

function add(it, how, v) {
  const key = it.id + ":" + how; let l = lines.find((x) => x.key === key);
  if (!l) { if (lines.length >= MAX_LINES) { note(`A bill can hold at most ${MAX_LINES} items. Print this one, then start a new bill.`); return; } l = { key, it, how, g: 0, a: 0, q: 0 }; lines.push(l); }
  if (how === "weight") l.g += v; else if (how === "amount") l.a += v * 100; else l.q += v;
  note(""); renderBill(); render();
}
function calc(l) { const r = l.it.rate;
  if (l.how === "weight") return { t: lineTotal(r, l.g), g: l.g, d: `${kg(l.g)} × ${money(r)}/kg` };
  if (l.how === "amount") { const g = gramsFor(l.a, r); return { t: l.a, g, d: `${money(l.a)} = about ${kg(g)}` }; }
  return { t: r * l.q, g: 0, d: `${l.q} × ${money(r)}` }; }
const note = (t) => { $("notice").innerHTML = t ? `<div class="note">${t}</div>` : ""; };

// ---- Preset buttons (shared) -----------------------------------------------------------------------------------
const wBtn = (it) => WEIGHTS.map((g) => `<button class="ptn" data-add="${it.id}|weight|${g}">${g === 1000 ? "1 kg" : g + " g"}<small>${money(lineTotal(it.rate, g))}</small></button>`).join("") + `<button class="ptn other" data-more="${it.id}|weight">Other</button>`;
const aBtn = (it) => AMOUNTS.map((a) => `<button class="ptn" data-add="${it.id}|amount|${a}">₹${a}<small>≈ ${kg(gramsFor(a * 100, it.rate))}</small></button>`).join("") + `<button class="ptn other" data-more="${it.id}|amount">Other ₹</button>`;
const cBtn = (it) => COUNTS.map((c) => `<button class="ptn" data-add="${it.id}|count|${c}">${c}<small>${c === 1 ? "piece" : "pieces"}</small></button>`).join("") + `<button class="ptn other" data-more="${it.id}|count">Other</button>`;
const rateTxt = (it) => `${money(it.rate)}/${it.unit === "kg" ? "kg" : "pc"}`;

// ---- Layout A --------------------------------------------------------------------------------------------------
function viewA() {
  const items = CATALOG[tab]; if (sel && !items.some((i) => i.id === sel)) sel = null;
  const cur = sel ? item(sel) : null;
  const cards = items.map((it) => `<button class="a-card c-${it.f} ${sel === it.id ? "sel" : sel ? "dim" : ""}" data-sel="${it.id}"><span class="fam">${FAM[it.f]}</span><span class="n">${it.ta}</span><span class="tag">${it.en}</span><span class="r">${rateTxt(it)}</span></button>`).join("");
  let bar = `<div class="a-bar"><div class="hint">Tap an item above, then choose the weight or amount here</div></div>`;
  if (cur) bar = `<div class="a-bar c-${cur.f}"><div class="who">${cur.ta} · ${cur.en} · ${rateTxt(cur)}</div>` +
    (cur.unit === "piece" ? `<div><p class="lab">How many</p><div class="row5">${cBtn(cur)}</div></div>` : `<div><p class="lab">By weight</p><div class="row5">${wBtn(cur)}</div></div><div><p class="lab">By amount</p><div class="row5">${aBtn(cur)}</div></div>`) + `</div>`;
  return `<div class="a-cards ${items.length === 3 ? "three" : ""}">${cards}</div>${bar}`;
}
// ---- Layout B --------------------------------------------------------------------------------------------------
function viewB() {
  const items = CATALOG[tab]; if (!sel || !items.some((i) => i.id === sel)) sel = items[0].id;
  const cur = item(sel);
  const list = items.map((it) => `<button class="b-item c-${it.f} ${sel === it.id ? "sel" : ""}" data-sel="${it.id}"><span class="n">${it.ta}</span><span class="s">${FAM[it.f]} · ${it.en} · ${rateTxt(it)}</span></button>`).join("");
  const sec = (label, btns) => `<div class="b-sec"><p class="lab">${label}</p><div class="grid">${btns}</div></div>`;
  const panel = `<div class="b-panel c-${cur.f}"><div class="b-head"><span class="n">${cur.ta}</span><span class="tag">${cur.en}</span><b>${rateTxt(cur)}</b></div>` +
    (cur.unit === "piece" ? sec("How many", cBtn(cur)) : sec("By weight", wBtn(cur)) + sec("By amount", aBtn(cur))) + `</div>`;
  return `<div class="b"><div class="b-list">${list}</div>${panel}</div>`;
}
// ---- Layout C --------------------------------------------------------------------------------------------------
function viewC() {
  const items = CATALOG[tab];
  return `<div class="c-grid">${items.map((it) => `<div class="c-card c-${it.f}"><div class="c-head"><span class="n">${it.ta}</span><span class="tag">${it.en}</span></div>
    <div class="c-body">${it.unit === "piece"
      ? `<button class="ptn" data-add="${it.id}|count|1">1<small>piece</small></button><button class="ptn" data-add="${it.id}|count|2">2<small>pieces</small></button>`
      : `<button class="ptn" data-add="${it.id}|weight|500">500 g<small>${money(lineTotal(it.rate, 500))}</small></button><button class="ptn" data-add="${it.id}|weight|1000">1 kg<small>${money(lineTotal(it.rate, 1000))}</small></button>`}
      <button class="ptn other" data-sheet="${it.id}">More</button></div>
    <div style="padding:0 12px 8px;color:var(--muted);font-weight:800;font-size:14px">${rateTxt(it)}</div></div>`).join("")}</div>`;
}

// ---- Render ----------------------------------------------------------------------------------------------------
function render() {
  $("tabs").innerHTML = Object.keys(CATALOG).map((n) => `<button class="tab ${n === tab ? "on" : ""}" data-t="${n}">${n}</button>`).join("");
  $("stage").innerHTML = layout === "A" ? viewA() : layout === "B" ? viewB() : viewC();
}
function renderBill() {
  $("lines").innerHTML = lines.length ? lines.map((l, i) => { const c = calc(l); return `<div class="line"><span class="line__name">${l.it.ta}</span><span class="line__amt">${money(c.t)}</span><button class="x" data-rm="${i}">✕</button><span class="line__detail">${FAM[l.it.f]} · ${l.it.en} · ${c.d}</span></div>`; }).join("") : `<div class="empty"><div style="font-size:40px">🐔</div><b>No items yet</b></div>`;
  const cs = lines.map(calc), sum = cs.reduce((s, c) => s + c.t, 0), g = cs.reduce((s, c) => s + c.g, 0);
  $("total").textContent = money(sum); $("sub").textContent = lines.length ? `${kg(g)} in total` : "";
  $("print").textContent = "Print bill " + money(sum); $("print").disabled = !lines.length;
  $("pay").innerHTML = ["Cash", "UPI", "Credit", "Split"].map((p) => `<button class="${p === payment ? "on" : ""}" data-p="${p}">${p}</button>`).join("");
}

// ---- Entry sheets ----------------------------------------------------------------------------------------------
function openMore(id) { // layout C: all presets in one panel
  const it = item(id);
  $("sheet").className = "sheet more-sheet c-" + it.f;
  $("sheet").innerHTML = `<h4>${it.ta} <small style="color:#6b5a52">${it.en} · ${rateTxt(it)}</small></h4>` +
    (it.unit === "piece" ? `<div class="sec"><p class="lab">How many</p><div class="row5">${cBtn(it)}</div></div>` : `<div class="sec"><p class="lab">By weight</p><div class="row5">${wBtn(it)}</div></div><div class="sec"><p class="lab">By amount</p><div class="row5">${aBtn(it)}</div></div>`) +
    `<div class="rowb"><button data-close>Close</button></div>`;
  $("back").classList.add("on");
}
function openEntry(id, how) {
  const it = item(id); custom = { it, how }; entry = "";
  $("sheet").className = "sheet";
  $("sheet").innerHTML = `<h4>${it.ta} <small style="color:#6b5a52">${how === "weight" ? "grams" : how === "amount" ? "amount in ₹" : "count"}</small></h4><div class="big" id="entry">0</div><div class="preview" id="preview"></div><div class="keys">${["1","2","3","4","5","6","7","8","9","C","0","⌫"].map((k) => `<button data-k="${k}">${k}</button>`).join("")}</div><div class="rowb"><button data-close>Cancel</button><button class="go" id="ok">Add to bill</button></div>`;
  $("back").classList.add("on"); showEntry();
}
function showEntry() {
  const v = Number(entry || 0), { it, how } = custom;
  $("entry").textContent = (how === "amount" ? "₹" : "") + (entry || "0") + (how === "weight" ? " g" : "");
  $("preview").textContent = !v ? "" : how === "weight" ? `= ${money(lineTotal(it.rate, v))}` : how === "amount" ? `≈ ${kg(gramsFor(v * 100, it.rate))} at ${money(it.rate)}/kg` : `= ${money(it.rate * v)}`;
}

// ---- Events ----------------------------------------------------------------------------------------------------
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.l) { layout = d.l; document.querySelectorAll(".switch button").forEach((x) => x.classList.toggle("on", x.dataset.l === layout)); render(); }
  else if (d.t) { tab = d.t; sel = null; render(); }
  else if (d.sel) { sel = d.sel; render(); }
  else if (d.add) { const [id, how, v] = d.add.split("|"); add(item(id), how, Number(v)); }
  else if (d.more) { const [id, how] = d.more.split("|"); $("back").classList.remove("on"); openEntry(id, how); }
  else if (d.sheet) openMore(d.sheet);
  else if ("close" in d) $("back").classList.remove("on");
  else if (d.rm) { lines.splice(Number(d.rm), 1); note(""); renderBill(); render(); }
  else if (d.p) { payment = d.p; renderBill(); }
  else if (d.k !== undefined) { entry = d.k === "C" ? "" : d.k === "⌫" ? entry.slice(0, -1) : (entry + d.k).slice(0, 5); showEntry(); }
  else if (b.id === "ok") { const v = Number(entry || 0); if (v > 0) add(custom.it, custom.how, v); $("back").classList.remove("on"); }
  else if (b.id === "print") { alert("Sample only: the real app would save and print this bill."); lines = []; renderBill(); render(); }
  // choosing a preset inside the "More" panel closes it
  if (d.add && $("sheet").classList.contains("more-sheet")) $("back").classList.remove("on");
});
render(); renderBill();
</script>
</body>
