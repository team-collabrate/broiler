<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Honey Broilers: counter prototype (B, revised)</title>
<style>
  :root { --accent:#d71920; --accent-soft:#fdebea; --bg:#fffaf2; --surface:#fff; --text:#1f1512; --muted:#6b5a52; --border:#eadccb; --green:#17803d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Noto Sans Tamil", Roboto, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  button { font-family: inherit; cursor: pointer; }
  .app { height: 100%; display: flex; }
  .rail { width: 84px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; }
  .logo { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; }
  .pill { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #e3f5e8; color: var(--green); }
  .gear { margin-top: auto; width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent); background: #fff; color: var(--accent); font-size: 20px; }
  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 12px 14px 12px; gap: 10px; }
  .tabs { flex: none; display: flex; border-bottom: 2px solid var(--border); }
  .tab { flex: 1; padding: 10px 0; border: 0; background: none; font-size: 18px; font-weight: 800; color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .c-cc { --c:#b45309; } .c-br { --c:#d71920; } .c-mu { --c:#8b1d3a; } .c-ot { --c:#2f6f5e; }
  .stage { flex: 1; min-height: 0; display: flex; gap: 12px; }

  /* left list: the families */
  .list { width: 30%; flex: none; display: flex; flex-direction: column; gap: 10px; }
  .fam { flex: none; height: clamp(110px, 19vh, 150px); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 4px; padding: 10px 18px; border: 2px solid var(--c); border-left-width: 12px; background: #fff; color: var(--text); border-radius: 16px; text-align: left; }
  .fam .n { font-size: clamp(18px, 1.9vw, 26px); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
  .fam .s { font-size: 13px; color: var(--muted); font-weight: 700; }
  .fam.sel { background: var(--c); color: #fff; } .fam.sel .s { color: #ffe9d6; }

  /* right panel */
  .panel { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 2px solid var(--border); border-radius: 20px; padding: 12px; }
  .head { flex: none; background: var(--c); color: #fff; border-radius: 14px; padding: 8px 12px 8px 16px; display: flex; align-items: center; gap: 12px; }
  .head .n { font-size: clamp(20px, 2.2vw, 30px); font-weight: 800; flex: 1; min-width: 0; line-height: 1.15; display: flex; flex-direction: column; }
  .head .n small { font-size: 15px; font-weight: 700; opacity: .92; }
    .seg { display: flex; background: rgba(0,0,0,.22); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { border: 0; border-radius: 9px; padding: 10px 16px; font-size: clamp(14px, 1.5vw, 18px); font-weight: 800; background: transparent; color: #fff; white-space: nowrap; }
  .seg button.on { background: #fff; color: var(--c); }
  .modebar { flex: none; display: flex; background: #eee3d3; border-radius: 14px; padding: 4px; gap: 4px; }
  .modebar button { flex: 1; border: 0; border-radius: 10px; padding: 12px 0; font-size: 17px; font-weight: 800; background: transparent; color: var(--muted); }
  .modebar button.on { background: var(--c); color: #fff; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; padding-top: 6px; gap: 14px; }
  .squares { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-content: start; }
  .sq { aspect-ratio: 1 / 1; max-height: 100%; border: 3px solid var(--c); background: #fff; color: var(--c); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: clamp(20px, 2.6vw, 34px); font-weight: 800; line-height: 1; white-space: nowrap; }
  .sq small { font-size: clamp(13px, 1.4vw, 19px); font-weight: 700; color: var(--muted); }
  .sq:active { background: var(--c); color: #fff; } .sq:active small { color: #fff; }
  .other { flex: none; height: 62px; border: 3px dashed #b9a896; background: #fff; color: var(--text); border-radius: 16px; font-size: 20px; font-weight: 800; }
  .other:active { background: #eee3d3; }

  /* bill */
  .bill { width: 340px; flex: none; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px 14px 14px; gap: 8px; }
  .bill h2 { margin: 0; color: var(--accent); font-size: 17px; }
  .lines { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  .line { border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto 26px; gap: 1px 8px; align-items: center; }
  .line__name { font-weight: 800; } .line__amt { font-weight: 800; }
  .line__detail { grid-column: 1 / 3; font-size: 12px; color: var(--muted); }
  .x { grid-row: 1 / 3; grid-column: 3; border: 0; background: none; font-size: 18px; color: var(--muted); }
  .total { display: flex; justify-content: space-between; align-items: baseline; } .total span { color: var(--muted); } .total strong { font-size: 28px; }
  .sub { color: var(--muted); font-size: 12px; text-align: right; margin-top: -6px; }
  .print { height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 800; } .print:disabled { background: #e8dccb; color: var(--muted); }
  .pay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .pay button { height: 44px; border-radius: 12px; border: 2px solid var(--border); background: #fff; font-weight: 800; } .pay button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .note { font-size: 12px; color: #a80f15; background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }
  .back { position: fixed; inset: 0; background: rgba(20,21,26,.45); display: none; place-items: center; z-index: 9; } .back.on { display: grid; }
  .sheet { width: 440px; max-width: 94vw; background: #fff; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .sheet h4 { margin: 0; font-size: 20px; } .sheet .big { font-size: 38px; font-weight: 800; text-align: center; border: 2px solid var(--border); border-radius: 14px; padding: 6px; min-height: 62px; }
  .preview { text-align: center; color: var(--muted); font-weight: 700; min-height: 22px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .keys button { height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-size: 22px; font-weight: 800; }
  .rowb { display: flex; gap: 10px; } .rowb button { flex: 1; height: 50px; border-radius: 14px; border: 1px solid var(--border); background: #fff; font-weight: 800; font-size: 16px; } .rowb .go { background: var(--accent); color: #fff; border-color: var(--accent); }
  .legend { position: fixed; left: 96px; bottom: 2px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="rail"><div class="logo">HB</div><span class="pill">● Online</span><span class="pill">✓ Printer</span><button class="gear">⚙</button></aside>
  <section class="main"><div class="tabs" id="tabs"></div><div class="stage" id="stage"></div></section>
  <aside class="bill">
    <h2>Bill</h2><div class="lines" id="lines"></div><div id="notice"></div>
    <div class="total"><span>Total</span><strong id="total">₹0.00</strong></div><div class="sub" id="sub"></div>
    <button class="print" id="print" disabled>Print bill ₹0.00</button><div class="pay" id="pay"></div>
  </aside>
</div>
<div class="legend">Design prototype: nothing is saved or printed. Rates are examples.</div>
<div class="back" id="back"><div class="sheet" id="sheet"></div></div>

<script>
// ---- Example catalogue. Each family has one or two variants; rates are paise per kg (or per piece). ----------------
const CATALOG = {
  Chicken: [
    { id: "cc", f: "cc", ta: "நாட்டுக்கோழி", en: "Country chicken", unit: "kg", variants: [
      { id: "cc-bone", label: "With bone", rate: 45000 }, { id: "cc-boneless", label: "Boneless", rate: 65000 } ] },
    { id: "br", f: "br", ta: "பிராய்லர்", en: "Broiler chicken", unit: "kg", variants: [
      { id: "br-bone", label: "With bone", rate: 24000 }, { id: "br-boneless", label: "Boneless", rate: 32000 } ] },
  ],
  Mutton: [
    { id: "mu", f: "mu", ta: "மட்டன்", en: "Mutton", unit: "kg", variants: [
      { id: "mu-bone", label: "With bone", rate: 80000 }, { id: "mu-boneless", label: "Boneless", rate: 95000 } ] },
    { id: "mu-kudal", f: "mu", ta: "குடல் (போட்டி)", en: "Intestines", unit: "kg", variants: [{ id: "mu-kudal", label: "", rate: 20000 }] },
    { id: "mu-liver", f: "mu", ta: "ஈரல்", en: "Liver", unit: "kg", variants: [{ id: "mu-liver", label: "", rate: 90000 }] },
  ],
  Others: [
    { id: "ot-quail", f: "ot", ta: "காடை", en: "Quail", unit: "piece", variants: [{ id: "ot-quail", label: "", rate: 6000 }] },
    { id: "ot-blood", f: "ot", ta: "இரத்தம்", en: "Blood", unit: "piece", variants: [{ id: "ot-blood", label: "", rate: 2000 }] },
    { id: "ot-masala", f: "ot", ta: "மசாலா", en: "Masala", unit: "piece", variants: [{ id: "ot-masala", label: "", rate: 1000 }] },
  ],
};
const WEIGHTS = [250, 500, 750, 1000], AMOUNTS = [100, 150, 200, 300], COUNTS = [1, 2, 3, 4], MAX_LINES = 5;

// ---- Maths (whole numbers: paise and grams) -------------------------------------------------------------------
const money = (p) => "₹" + (p / 100).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const lineTotal = (rate, g) => Math.round(rate * g / 1000);        // weight -> money
const gramsFor = (amtP, rate) => Math.round(amtP * 1000 / rate);   // money -> weight (about)
const kg = (g) => g < 1000 ? g + " g" : (g / 1000).toFixed(3).replace(/\.?0+$/, "") + " kg";
const $ = (id) => document.getElementById(id);

// ---- State ---------------------------------------------------------------------------------------------------
let tab = "Chicken", fam = {}, variant = {}, mode = "weight", lines = [], payment = "Cash", custom = null, entry = "";
const families = () => CATALOG[tab];
const curFam = () => { const l = families(); return l.find((x) => x.id === fam[tab]) || (fam[tab] = l[0].id, l[0]); };
const curVar = (f) => f.variants.find((v) => v.id === variant[f.id]) || (variant[f.id] = f.variants[0].id, f.variants[0]);

function add(f, v, how, n) {
  const key = v.id + ":" + how; let l = lines.find((x) => x.key === key);
  if (!l) { if (lines.length >= MAX_LINES) { note(`A bill can hold at most ${MAX_LINES} items. Print this one, then start a new bill.`); return; } l = { key, f, v, how, g: 0, a: 0, q: 0 }; lines.push(l); }
  if (how === "weight") l.g += n; else if (how === "amount") l.a += n * 100; else l.q += n;
  note(""); renderBill();
}
function calc(l) { const r = l.v.rate;
  if (l.how === "weight") return { t: lineTotal(r, l.g), g: l.g, d: `${kg(l.g)} × ${money(r)}/kg` };
  if (l.how === "amount") { const g = gramsFor(l.a, r); return { t: l.a, g, d: `${money(l.a)} = about ${kg(g)}` }; }
  return { t: r * l.q, g: 0, d: `${l.q} × ${money(r)}` }; }
const note = (t) => { $("notice").innerHTML = t ? `<div class="note">${t}</div>` : ""; };

// ---- Screen --------------------------------------------------------------------------------------------------
function render() {
  $("tabs").innerHTML = Object.keys(CATALOG).map((n) => `<button class="tab ${n === tab ? "on" : ""}" data-t="${n}">${n}</button>`).join("");
  const f = curFam(), v = curVar(f), isPiece = f.unit === "piece";
  const list = families().map((x) => { const first = x.variants[0]; return `<button class="fam c-${x.f} ${x.id === f.id ? "sel" : ""}" data-fam="${x.id}"><span class="n">${x.ta}</span><span class="s">${x.en}${x.variants.length > 1 ? " · bone / boneless" : ""} · from ${money(Math.min(...x.variants.map((y) => y.rate)))}/${isPiece ? "pc" : "kg"}</span></button>`; }).join("");
  const seg = f.variants.length > 1 ? `<div class="seg">${f.variants.map((x) => `<button data-var="${x.id}" class="${x.id === v.id ? "on" : ""}">${x.label}</button>`).join("")}</div>` : "";
  const modebar = isPiece ? "" : `<div class="modebar"><button data-mode="weight" class="${mode === "weight" ? "on" : ""}">By weight</button><button data-mode="amount" class="${mode === "amount" ? "on" : ""}">By amount ₹</button></div>`;
  let sq, kind, otherLabel;
  if (isPiece) { kind = "count"; otherLabel = "Other count"; sq = COUNTS.map((c) => `<button class="sq" data-add="${v.id}|count|${c}">${c}<small>${c === 1 ? "piece" : "pieces"}</small></button>`).join(""); }
  else if (mode === "weight") { kind = "weight"; otherLabel = "Other weight"; sq = WEIGHTS.map((g) => `<button class="sq" data-add="${v.id}|weight|${g}">${g === 1000 ? "1 kg" : g + " g"}<small>${money(lineTotal(v.rate, g))}</small></button>`).join(""); }
  else { kind = "amount"; otherLabel = "Other amount ₹"; sq = AMOUNTS.map((a) => `<button class="sq" data-add="${v.id}|amount|${a}">₹${a}<small>≈ ${kg(gramsFor(a * 100, v.rate))}</small></button>`).join(""); }
  $("stage").innerHTML = `<div class="list">${list}</div>
    <div class="panel c-${f.f}">
      <div class="head"><span class="n">${f.ta}<small>${money(v.rate)}/${isPiece ? "pc" : "kg"}</small></span>${seg}</div>
      ${modebar}
      <div class="body"><div class="squares">${sq}</div>
      <button class="other" data-more="${v.id}|${kind}">${otherLabel}</button></div>
    </div>`;
}
function renderBill() {
  $("lines").innerHTML = lines.length ? lines.map((l, i) => { const c = calc(l); return `<div class="line"><span class="line__name">${l.f.ta}</span><span class="line__amt">${money(c.t)}</span><button class="x" data-rm="${i}">✕</button><span class="line__detail">${l.f.en}${l.v.label ? " · " + l.v.label : ""} · ${c.d}</span></div>`; }).join("") : `<div class="empty"><div style="font-size:40px">🐔</div><b>No items yet</b></div>`;
  const cs = lines.map(calc), sum = cs.reduce((s, c) => s + c.t, 0), g = cs.reduce((s, c) => s + c.g, 0);
  $("total").textContent = money(sum); $("sub").textContent = lines.length ? `${kg(g)} in total` : "";
  $("print").textContent = "Print bill " + money(sum); $("print").disabled = !lines.length;
  $("pay").innerHTML = ["Cash", "UPI", "Credit", "Split"].map((p) => `<button class="${p === payment ? "on" : ""}" data-p="${p}">${p}</button>`).join("");
}

// ---- Any other weight, amount or count ------------------------------------------------------------------------
const findVar = (id) => { for (const l of Object.values(CATALOG)) for (const f of l) for (const v of f.variants) if (v.id === id) return { f, v }; };
function openEntry(id, how) {
  const { f, v } = findVar(id); custom = { f, v, how }; entry = "";
  $("sheet").innerHTML = `<h4>${f.ta} <small style="color:#6b5a52">${v.label || f.en} · ${how === "weight" ? "grams" : how === "amount" ? "amount in ₹" : "count"}</small></h4><div class="big" id="entry">0</div><div class="preview" id="preview"></div><div class="keys">${["1","2","3","4","5","6","7","8","9","C","0","⌫"].map((k) => `<button data-k="${k}">${k}</button>`).join("")}</div><div class="rowb"><button data-close>Cancel</button><button class="go" id="ok">Add to bill</button></div>`;
  $("back").classList.add("on"); showEntry();
}
function showEntry() {
  const n = Number(entry || 0), { v, how } = custom;
  $("entry").textContent = (how === "amount" ? "₹" : "") + (entry || "0") + (how === "weight" ? " g" : "");
  $("preview").textContent = !n ? "" : how === "weight" ? `= ${money(lineTotal(v.rate, n))}` : how === "amount" ? `≈ ${kg(gramsFor(n * 100, v.rate))} at ${money(v.rate)}/kg` : `= ${money(v.rate * n)}`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.t) { tab = d.t; render(); }
  else if (d.fam) { fam[tab] = d.fam; render(); }
  else if (d.var) { variant[curFam().id] = d.var; render(); }
  else if (d.mode) { mode = d.mode; render(); }
  else if (d.add) { const [id, how, n] = d.add.split("|"); const { f, v } = findVar(id); add(f, v, how, Number(n)); }
  else if (d.more) { const [id, how] = d.more.split("|"); openEntry(id, how); }
  else if ("close" in d) $("back").classList.remove("on");
  else if (d.rm) { lines.splice(Number(d.rm), 1); note(""); renderBill(); }
  else if (d.p) { payment = d.p; renderBill(); }
  else if (d.k !== undefined) { entry = d.k === "C" ? "" : d.k === "⌫" ? entry.slice(0, -1) : (entry + d.k).slice(0, 5); showEntry(); }
  else if (b.id === "ok") { const n = Number(entry || 0); if (n > 0) add(custom.f, custom.v, custom.how, n); $("back").classList.remove("on"); }
  else if (b.id === "print") { alert("Prototype only: the real app would save and print this bill."); lines = []; renderBill(); }
});
render(); renderBill();
</script>
</body>
</html>
