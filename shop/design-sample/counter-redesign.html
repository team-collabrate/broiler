<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Honey Broilers: counter redesign sample</title>
<style>
  :root {
    --accent: #d71920; --accent-dark: #a80f15; --accent-soft: #fdebea; --gold: #f59e0b;
    --bg: #fffaf2; --surface: #fff; --text: #1f1512; --muted: #6b5a52; --border: #eadccb;
    --green: #17803d; --green-soft: #e3f5e8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Noto Sans Tamil", Roboto, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  button { font-family: inherit; cursor: pointer; }
  .app { height: 100%; display: flex; }
  /* rail */
  .rail { width: 96px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 0; }
  .logo { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .pill { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--green-soft); color: var(--green); }
  .gear { margin-top: auto; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--accent); background: #fff; color: var(--accent); font-size: 22px; }
  /* main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px 16px 16px; gap: 12px; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 14px; }
  .tabs { flex: 1; display: flex; border-bottom: 2px solid var(--border); }
  .tab { flex: 1; padding: 12px 0; border: 0; background: none; font-size: 18px; font-weight: 800; color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .mode { display: flex; background: #eee3d3; border-radius: 14px; padding: 4px; }
  .mode button { border: 0; background: none; padding: 10px 18px; border-radius: 10px; font-size: 16px; font-weight: 800; color: var(--muted); }
  .mode button.on { background: var(--accent); color: #fff; }
  .scroll { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .group { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .group h3 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .group h3 b { color: var(--text); font-size: 17px; text-transform: none; letter-spacing: 0; margin-right: 8px; }
  .tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 10px; }
  .tile { --c: var(--accent); min-height: 0; background: var(--surface); border: 2px solid var(--c); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .tile.has { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
  .tile { flex-direction: row; }
  .tile__head { flex: none; width: 27%; background: var(--c); color: #fff; text-align: center; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .tile__name { font-size: clamp(20px, 2.1vw, 28px); font-weight: 800; line-height: 1.15; }
  .tile__meta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 8px; font-size: 15px; font-weight: 700; }
  .tag { background: rgba(255, 255, 255, .22); border-radius: 999px; padding: 1px 10px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .presets { flex: 1; min-width: 0; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 8px; padding: 10px; }
  .preset { white-space: nowrap; grid-column: span 1; min-height: 0; border: 2px solid var(--c); background: #fff; color: var(--c); border-radius: 14px; font-size: clamp(16px, 2vw, 28px); font-weight: 800; line-height: 1.05; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .preset small { font-size: clamp(12px, 1.2vw, 15px); font-weight: 700; color: var(--muted); }
  .preset:active { background: var(--c); color: #fff; }
  .preset:active small { color: #fff; }
  .preset.more { grid-column: span 1; text-align: center; padding: 0 4px; border-style: dashed; color: var(--text); border-color: #b9a896; font-size: clamp(18px, 1.9vw, 24px); }
  .preset.more:active { background: #eee3d3; color: var(--text); }
  /* bill */
  .bill { width: 360px; flex: none; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 14px 16px 16px; gap: 10px; }
  .bill h2 { margin: 0; color: var(--accent); font-size: 18px; }
  .lines { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  .line { border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto 28px; gap: 2px 8px; align-items: center; }
  .line__name { font-weight: 800; font-size: 16px; }
  .line__amt { font-weight: 800; }
  .line__detail { grid-column: 1 / 3; font-size: 13px; color: var(--muted); }
  .x { grid-row: 1 / 3; grid-column: 3; border: 0; background: none; font-size: 18px; color: var(--muted); }
  .total { display: flex; justify-content: space-between; align-items: baseline; }
  .total span { color: var(--muted); }
  .total strong { font-size: 30px; }
  .sub { color: var(--muted); font-size: 13px; text-align: right; margin-top: -6px; }
  .print { height: 56px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 800; }
  .print:disabled { background: #e8dccb; color: var(--muted); }
  .pay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pay button { height: 48px; border-radius: 12px; border: 2px solid var(--border); background: #fff; font-weight: 800; font-size: 15px; }
  .pay button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .note { font-size: 12px; color: var(--accent-dark); background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }
  /* custom entry */
  .back { position: fixed; inset: 0; background: rgba(20, 21, 26, .4); display: none; place-items: center; z-index: 5; }
  .back.on { display: grid; }
  .sheet { width: 420px; background: #fff; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .sheet h4 { margin: 0; font-size: 20px; }
  .sheet .big { font-size: 40px; font-weight: 800; text-align: center; border: 2px solid var(--border); border-radius: 14px; padding: 8px; min-height: 66px; }
  .preview { text-align: center; color: var(--muted); min-height: 22px; font-weight: 700; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .keys button { height: 56px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-size: 22px; font-weight: 800; }
  .row { display: flex; gap: 10px; } .row button { flex: 1; height: 52px; border-radius: 14px; border: 1px solid var(--border); background: #fff; font-weight: 800; font-size: 16px; }
  .row .go { background: var(--accent); color: #fff; border-color: var(--accent); }
  .legend { position: fixed; bottom: 8px; left: 108px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="logo">HB</div>
    <span class="pill">● Online</span>
    <span class="pill" style="background:#e3f5e8">✓ Printer</span>
    <button class="gear" aria-label="Admin">⚙</button>
  </aside>

  <section class="main">
    <div class="top">
      <div class="tabs" id="tabs"></div>
      <div class="mode" id="mode" title="How the customer asks">
        <button data-m="weight" class="on">By weight</button>
        <button data-m="amount">By amount ₹</button>
      </div>
    </div>
    <div class="scroll" id="scroll"></div>
  </section>

  <aside class="bill">
    <h2>Bill</h2>
    <div class="lines" id="lines"></div>
    <div id="notice"></div>
    <div class="total"><span>Total</span><strong id="total">₹0.00</strong></div>
    <div class="sub" id="sub"></div>
    <button class="print" id="print" disabled>Print bill ₹0.00</button>
    <div class="pay" id="pay"></div>
  </aside>
</div>

<div class="back" id="back">
  <div class="sheet">
    <h4 id="sheetTitle"></h4>
    <div class="big" id="entry">0</div>
    <div class="preview" id="preview"></div>
    <div class="keys" id="keys"></div>
    <div class="row"><button id="cancel">Cancel</button><button class="go" id="ok">Add to bill</button></div>
  </div>
</div>
<div class="legend">Design sample only: nothing here is saved, printed or sent anywhere. Rates are example values.</div>

<script>
// ---- Example catalogue. Rates are in paise (per kg, or per piece). -------------------------------------------
const CATALOG = {
  Chicken: [
    { group: "Country chicken", ta: "நாட்டுக்கோழி", items: [
      { id: "cc-bone", ta: "எலும்புடன்", en: "With bone", rate: 45000, unit: "kg" },
      { id: "cc-boneless", ta: "எலும்பில்லா", en: "Boneless", rate: 65000, unit: "kg" } ] },
    { group: "Broiler chicken", ta: "பிராய்லர் கோழி", items: [
      { id: "br-bone", ta: "எலும்புடன்", en: "With bone", rate: 24000, unit: "kg" },
      { id: "br-boneless", ta: "எலும்பில்லா", en: "Boneless", rate: 32000, unit: "kg" } ] },
  ],
  Mutton: [
    { group: "Mutton", ta: "மட்டன்", items: [
      { id: "mu-bone", ta: "எலும்புடன்", en: "With bone", rate: 80000, unit: "kg" },
      { id: "mu-boneless", ta: "எலும்பில்லா", en: "Boneless", rate: 95000, unit: "kg" },
      { id: "mu-kudal", ta: "குடல் (போட்டி)", en: "Intestines (boti)", rate: 20000, unit: "kg" },
      { id: "mu-liver", ta: "ஈரல்", en: "Liver", rate: 90000, unit: "kg" } ] },
  ],
  Others: [
    { group: "Others", ta: "மற்றவை", items: [
      { id: "ot-quail", ta: "காடை", en: "Quail", rate: 6000, unit: "piece" },
      { id: "ot-blood", ta: "இரத்தம்", en: "Blood", rate: 2000, unit: "piece" },
      { id: "ot-masala", ta: "மசாலா", en: "Masala", rate: 1000, unit: "piece" } ] },
  ],
};
const WEIGHTS = [250, 500, 750, 1000];            // grams
const AMOUNTS = [100, 150, 200, 300, 500];        // rupees
const COUNTS = [1, 2, 3, 4, 5, 6];
const MAX_LINES = 5;

// ---- The math (paise and grams, whole numbers only) -----------------------------------------------------------
const money = (p) => "₹" + (p / 100).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const lineTotal = (rate, grams) => Math.round(rate * grams / 1000);          // weight -> money
const gramsForAmount = (amountP, rate) => Math.round(amountP * 1000 / rate); // money -> weight (shown as "about")
const kg = (g) => g < 1000 ? g + " g" : (g / 1000).toFixed(3).replace(/\.?0+$/, "") + " kg";

// ---- State ----------------------------------------------------------------------------------------------------
let tab = "Chicken", mode = "weight", lines = [], payment = "Cash", custom = null, entry = "";
const $ = (id) => document.getElementById(id);
const allItems = () => Object.values(CATALOG).flat().flatMap((g) => g.items.map((i) => ({ ...i, gta: g.ta === "மற்றவை" ? "" : g.ta + " " })));

/** Adds to the bill. The same item sold the same way is merged into one line: 250 g + 500 g becomes 750 g. */
function add(item, how, value) {
  const key = item.id + ":" + how;
  let line = lines.find((l) => l.key === key);
  if (!line) {
    if (lines.length >= MAX_LINES) { note(`A bill can hold at most ${MAX_LINES} items. Print this one, then start a new bill.`); return; }
    line = { key, item, how, grams: 0, qty: 0, amountP: 0 };
    lines.push(line);
  }
  if (how === "weight") line.grams += value;
  else if (how === "amount") line.amountP += value * 100;
  else line.qty += value;
  note("");
  render();
}
function totals(l) {
  const r = l.item.rate;
  if (l.how === "weight") return { total: lineTotal(r, l.grams), grams: l.grams, detail: `${kg(l.grams)} × ${money(r)}/kg` };
  if (l.how === "amount") { const g = gramsForAmount(l.amountP, r); return { total: l.amountP, grams: g, detail: `${money(l.amountP)} of it = about ${kg(g)}` }; }
  return { total: r * l.qty, grams: 0, detail: `${l.qty} × ${money(r)}` };
}
function note(t) { $("notice").innerHTML = t ? `<div class="note">${t}</div>` : ""; }

// ---- Screens --------------------------------------------------------------------------------------------------
function renderTabs() {
  $("tabs").innerHTML = Object.keys(CATALOG).map((n) => `<button class="tab ${n === tab ? "on" : ""}" data-t="${n}">${n}</button>`).join("");
  $("mode").style.visibility = tab === "Others" ? "hidden" : "visible";
}
function presetButtons(item) {
  const more = (kind, label) => `<button class="preset more" data-more="${kind}" data-id="${item.id}">${label}</button>`;
  if (item.unit === "piece") {
    return COUNTS.slice(0, 4).map((c) => `<button class="preset" data-a="count" data-id="${item.id}" data-v="${c}">${c}<small>${c === 1 ? "piece" : "pieces"}</small></button>`).join("") + more("count", "Other");
  }
  if (mode === "weight") {
    return WEIGHTS.map((g) => `<button class="preset" data-a="weight" data-id="${item.id}" data-v="${g}">${g === 1000 ? "1 kg" : g + " g"}<small>${money(lineTotal(item.rate, g))}</small></button>`).join("") + more("weight", "Other");
  }
  return AMOUNTS.slice(0, 4).map((a) => `<button class="preset" data-a="amount" data-id="${item.id}" data-v="${a}">₹${a}<small>≈ ${kg(gramsForAmount(a * 100, item.rate))}</small></button>`).join("") + more("amount", "Other ₹");
}
const FAMILY_COLOUR = { "Country chicken": "#b45309", "Broiler chicken": "#d71920", "Mutton": "#8b1d3a", "Others": "#2f6f5e" };
function renderCatalog() {
  $("scroll").innerHTML = CATALOG[tab].map((g) => `
    <div class="group">
      <h3><b>${g.ta}</b>${g.group}</h3>
      <div class="tiles" style="--cols:1">${g.items.map((it) => `
        <div class="tile ${lines.some((l) => l.item.id === it.id) ? "has" : ""}" style="--c:${FAMILY_COLOUR[g.group]}">
          <div class="tile__head">
            <div class="tile__name">${it.ta}</div>
            <div class="tile__meta"><span class="tag">${it.en}</span><span>${money(it.rate)}/${it.unit === "kg" ? "kg" : "pc"}</span></div>
          </div>
          <div class="presets">${presetButtons(it)}</div>
        </div>`).join("")}</div>
    </div>`).join("");
}
function renderBill() {
  $("lines").innerHTML = lines.length ? lines.map((l, i) => { const t = totals(l); return `
    <div class="line"><span class="line__name">${l.item.gta || ""}${l.item.ta}</span><span class="line__amt">${money(t.total)}</span><button class="x" data-rm="${i}" aria-label="Remove">✕</button><span class="line__detail">${l.item.en} · ${t.detail}</span></div>`; }).join("") : `<div class="empty"><div style="font-size:42px">🐔</div><b>No items yet</b><br/>Tap a weight or amount on any item</div>`;
  const all = lines.map(totals), sum = all.reduce((s, t) => s + t.total, 0), g = all.reduce((s, t) => s + t.grams, 0);
  $("total").textContent = money(sum);
  $("sub").textContent = lines.length ? `${kg(g)} in total` : "";
  $("print").textContent = "Print bill " + money(sum);
  $("print").disabled = lines.length === 0;
  $("pay").innerHTML = ["Cash", "UPI", "Credit", "Split"].map((p) => `<button class="${p === payment ? "on" : ""}" data-p="${p}">${p}</button>`).join("");
}
function render() { renderTabs(); renderCatalog(); renderBill(); }

// ---- Events ---------------------------------------------------------------------------------------------------
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.t) { tab = b.dataset.t; render(); }
  else if (b.dataset.m) { mode = b.dataset.m; document.querySelectorAll("#mode button").forEach((x) => x.classList.toggle("on", x.dataset.m === mode)); render(); }
  else if (b.dataset.a) { add(allItems().find((i) => i.id === b.dataset.id), b.dataset.a, Number(b.dataset.v)); }
  else if (b.dataset.more) openEntry(allItems().find((i) => i.id === b.dataset.id), b.dataset.more);
  else if (b.dataset.rm) { lines.splice(Number(b.dataset.rm), 1); note(""); render(); }
  else if (b.dataset.p) { payment = b.dataset.p; renderBill(); }
});
$("print").onclick = () => { alert("Sample only: the real app would save and print this bill."); lines = []; render(); };

// ---- Any other weight, amount or count ------------------------------------------------------------------------
function openEntry(item, how) {
  custom = { item, how }; entry = "";
  $("sheetTitle").innerHTML = `${item.ta} <small style="color:#6b5a52;font-size:14px">${how === "weight" ? "grams" : how === "amount" ? "amount in ₹" : "count"}</small>`;
  $("keys").innerHTML = ["1","2","3","4","5","6","7","8","9","C","0","⌫"].map((k) => `<button data-k="${k}">${k}</button>`).join("");
  $("back").classList.add("on"); showEntry();
}
function showEntry() {
  const v = Number(entry || 0), { item, how } = custom;
  $("entry").textContent = (how === "amount" ? "₹" : "") + (entry || "0") + (how === "weight" ? " g" : "");
  $("preview").textContent = !v ? "" : how === "weight" ? `= ${money(lineTotal(item.rate, v))}` : how === "amount" ? `≈ ${kg(gramsForAmount(v * 100, item.rate))} at ${money(item.rate)}/kg` : `= ${money(item.rate * v)}`;
}
$("keys").onclick = (e) => { const k = e.target.closest("button")?.dataset.k; if (k === undefined) return; entry = k === "C" ? "" : k === "⌫" ? entry.slice(0, -1) : (entry + k).slice(0, 5); showEntry(); };
$("cancel").onclick = () => $("back").classList.remove("on");
$("ok").onclick = () => { const v = Number(entry || 0); if (v > 0) add(custom.item, custom.how, v); $("back").classList.remove("on"); };
render();
</script>
</body>
</html>
